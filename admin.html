<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0c1b33"><title>لوحة إدارة أسامة فون</title><link rel="stylesheet" href="styles.css"></head><body class="adminbody">
<header class="top"><a class="backlink" href="index.html">← عرض المتجر</a><div class="brand"><div class="logo">أف</div><div><strong>لوحة الإدارة</strong><small>أسامة فون</small></div></div></header>
<main class="adminmain"><section id="loginPanel" class="panel loginpanel"><span class="eyebrow">منطقة محمية</span><h1>تسجيل دخول المسؤول</h1><p>استخدم البريد الإلكتروني الذي تم اعتماده كمسؤول في Firebase.</p><form id="loginForm"><label>البريد الإلكتروني<input id="email" type="email" autocomplete="username" required></label><label>كلمة المرور<input id="password" type="password" autocomplete="current-password" required minlength="6"></label><button class="btn primary" type="submit">دخول آمن</button><p id="loginError" class="error" role="alert"></p></form></section>
<section id="dashboard" hidden><div class="dashhead"><div><span class="eyebrow">إدارة المتجر</span><h1>لوحة التحكم</h1><p id="signedInAs"></p></div><button id="logout" class="btn outline">تسجيل الخروج</button></div><div id="adminNotice" class="notice"></div>
<div class="stats"><article><span>المنتجات</span><strong id="productCount">0</strong></article><article><span>متوفرة</span><strong id="availableCount">0</strong></article><article><span>الأقسام</span><strong id="categoryCount">0</strong></article></div>
<div class="admincols"><section class="panel"><h2 id="formTitle">إضافة منتج</h2><form id="productForm"><input id="productId" type="hidden"><label>اسم المنتج<input id="pName" required maxlength="100" placeholder="مثال: Redmi 15C"></label><label>القسم<select id="pCategory"><option>هواتف</option><option>إكسسوارات</option><option>قطع صيانة</option><option>خدمات</option><option>أخرى</option></select></label><label>السعر بالدينار الليبي<input id="pPrice" type="number" min="0" step="0.01" required></label><label>الكمية المتوفرة<input id="pQty" type="number" min="0" step="1" required value="1"></label><label>رابط صورة المنتج (HTTPS)<input id="pImage" type="url" placeholder="https://..."></label><label>وصف مختصر<textarea id="pDescription" rows="3" maxlength="500"></textarea></label><label class="check"><input id="pAvailable" type="checkbox" checked> المنتج ظاهر ومتاح للزبائن</label><div class="formactions"><button class="btn primary" type="submit">حفظ المنتج</button><button id="cancelEdit" class="btn outline" type="button" hidden>إلغاء التعديل</button></div><p id="formMessage" role="status"></p></form></section>
<section class="panel"><div class="listhead"><h2>المنتجات الحالية</h2><button id="refresh" class="btn outline">تحديث</button></div><div id="adminProducts" class="adminproducts"></div></section></div>
</section></main><script type="module" src="admin.js"></script></body></html>
